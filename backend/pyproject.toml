[project]
name = "lawyer-ai-backend"
version = "0.1.0"
description = "Case-prep AI for lawyers: ingest case files, find contradictions, build arguments, run mock trials."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-ai-slim[anthropic,google,openai]>=2.58.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
