# Synthetic case for testing. All people, places and numbers are fictional.
id: case1
title: State v. Arjun Verma
court: Court of the Judicial Magistrate First Class, Navgarh
charges: ["BNS 304(2) - snatching"]
user_side: defence
client: Arjun Verma
summary: >
  On 12-03-2026 evening a gold chain was snatched from Sunita Sharma on MG Road, Navgarh.
  The accused Arjun Verma (24) was arrested and a chain was allegedly recovered from his house
  on his disclosure. He says he was at a family function and was picked up a day earlier than
  the arrest memo shows.

